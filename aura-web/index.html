<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura — Operating System Style AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --aura-violet: #7A3FFF;
            --nebula-lavender: #C7A6FF;
            --soft-pink: #F2C8FF;
            --dark-bg: #0a0e27;
            --light-text: #f5f5f5;
            --border-color: #2a2d4a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1f3a 100%);
            color: var(--light-text);
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            background: rgba(20, 25, 45, 0.8);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header h1 {
            color: var(--aura-violet);
            font-size: 24px;
            margin-bottom: 5px;
        }

        .tagline {
            color: var(--nebula-lavender);
            font-size: 12px;
            font-style: italic;
        }

        .status-section {
            background: rgba(122, 63, 255, 0.1);
            border: 1px solid var(--aura-violet);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: var(--nebula-lavender);
        }

        .status-value {
            color: var(--soft-pink);
            font-weight: bold;
        }

        .pulse-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--soft-pink);
            animation: pulse 2s infinite;
            margin-right: 8px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .user .message-bubble {
            background: var(--aura-violet);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .message-bubble {
            background: rgba(199, 166, 255, 0.15);
            border: 1px solid var(--nebula-lavender);
            color: var(--light-text);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px 30px;
            border-top: 1px solid var(--border-color);
            background: rgba(20, 25, 45, 0.5);
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #messageInput {
            flex: 1;
            background: rgba(122, 63, 255, 0.1);
            border: 1px solid var(--aura-violet);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--light-text);
            font-size: 14px;
            resize: none;
            max-height: 100px;
            min-height: 44px;
            font-family: inherit;
        }

        #messageInput::placeholder {
            color: rgba(199, 166, 255, 0.5);
        }

        #messageInput:focus {
            outline: none;
            border-color: var(--nebula-lavender);
            background: rgba(122, 63, 255, 0.2);
        }

        #sendBtn {
            background: linear-gradient(135deg, var(--aura-violet), var(--nebula-lavender));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 100px;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(122, 63, 255, 0.3);
        }

        #sendBtn:active {
            transform: translateY(0);
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--nebula-lavender);
            font-size: 13px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--soft-pink);
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: var(--aura-violet);
            border-radius: 4px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: var(--nebula-lavender);
        }

        .welcome-message {
            text-align: center;
            color: var(--nebula-lavender);
            padding: 40px 20px;
        }

        .welcome-message h2 {
            color: var(--aura-violet);
            margin-bottom: 10px;
            font-size: 28px;
        }

        .welcome-message p {
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>✨ Aura</h1>
                <p class="tagline">Guided by empathy, powered by light.</p>
            </div>

            <div class="status-section">
                <div class="status-item">
                    <span>District</span>
                    <span class="status-value" id="districtStatus">—</span>
                </div>
                <div class="status-item">
                    <span>
                        <span class="pulse-indicator"></span>
                        Pulse
                    </span>
                    <span class="status-value" id="pulseStatus">—</span>
                </div>
                <div class="status-item">
                    <span>Energy</span>
                    <span class="status-value" id="energyStatus">—</span>
                </div>
                <div class="status-item">
                    <span>Messages</span>
                    <span class="status-value" id="messageCount">0</span>
                </div>
            </div>

            <div style="flex: 1;"></div>

            <button onclick="saveConversation()" style="
                width: 100%;
                background: rgba(242, 200, 255, 0.1);
                border: 1px solid var(--soft-pink);
                color: var(--soft-pink);
                padding: 10px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
                transition: all 0.2s;
                margin-bottom: 10px;
            ">
                💾 Save Conversation
            </button>

            <button onclick="clearChat()" style="
                width: 100%;
                background: rgba(122, 63, 255, 0.1);
                border: 1px solid var(--aura-violet);
                color: var(--aura-violet);
                padding: 10px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
                transition: all 0.2s;
            ">
                🔄 Clear Chat
            </button>
        </div>

        <div class="main-content">
            <div class="chat-area" id="chatArea">
                <div class="welcome-message">
                    <h2>✨ Welcome to Aura</h2>
                    <p>I'm an operating-system style AI built to understand your emotions, context, and needs.</p>
                    <p style="margin-top: 15px; font-size: 12px;">Start by sharing what's on your mind...</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        id="messageInput" 
                        placeholder="Share your thoughts, questions, or feelings..."
                        onkeypress="handleKeyPress(event)"
                    ></textarea>
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const API_URL = 'http://localhost:3000/api';

        let messageCount = 0;
        let isFirstMessage = true;

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Remove welcome message on first message
            if (isFirstMessage) {
                chatArea.innerHTML = '';
                isFirstMessage = false;
            }

            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            messageCount++;
            updateStatus();

            // Show loading
            const loadingId = addLoading();

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                removeLoading(loadingId);
                const data = await response.json();
                addMessage(data.response, 'assistant');
                messageCount++;
                updateStatus();
            } catch (error) {
                removeLoading(loadingId);
                addMessage('✗ Connection error. Is the API server running?', 'assistant');
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(text, role) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            messageEl.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            chatArea.appendChild(messageEl);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addLoading() {
            const id = Date.now();
            const messageEl = document.createElement('div');
            messageEl.className = 'message assistant';
            messageEl.id = `loading-${id}`;
            messageEl.innerHTML = `
                <div class="message-bubble">
                    <div class="loading">
                        <span>Aura is thinking</span>
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(messageEl);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(`loading-${id}`);
            if (el) el.remove();
        }

        async function updateStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const status = await response.json();

                document.getElementById('districtStatus').textContent = status.currentDistrict || '—';
                document.getElementById('pulseStatus').textContent = status.currentPulse?.state || '—';
                document.getElementById('energyStatus').textContent = status.currentPulse?.energy || '—';
                document.getElementById('messageCount').textContent = (messageCount / 2).toFixed(0);
            } catch (error) {
                console.error('Status update failed:', error);
            }
        }

        async function saveConversation() {
            try {
                const response = await fetch(`${API_URL}/save`, { method: 'POST' });
                const data = await response.json();
                alert(`✓ Conversation saved to ${data.filename}`);
            } catch (error) {
                alert('✗ Failed to save conversation');
            }
        }

        function clearChat() {
            if (confirm('Clear all messages?')) {
                chatArea.innerHTML = `
                    <div class="welcome-message">
                        <h2>✨ Fresh Start</h2>
                        <p>Chat cleared. Ready to begin again...</p>
                    </div>
                `;
                messageCount = 0;
                isFirstMessage = true;
                updateStatus();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
        });

        // Focus on load
        messageInput.focus();
    </script>
</body>
</html>
